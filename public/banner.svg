<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="100%" height="100%">
  <defs>
    <!-- Baseplate Dot Grid Pattern -->
    <pattern id="baseplate-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.5" fill="#FFD700" fill-opacity="0.14" />
    </pattern>

    <linearGradient id="stud-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3B30" />
      <stop offset="100%" stop-color="#8B0000" />
    </linearGradient>
    <linearGradient id="stud-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE033" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <linearGradient id="stud-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A84FF" />
      <stop offset="100%" stop-color="#003D7A" />
    </linearGradient>
    <linearGradient id="stud-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#005F1E" />
    </linearGradient>
  </defs>

  <!-- Hard Drop Shadow of the Brick Card -->
  <rect x="14" y="14" width="852" height="222" rx="14" fill="#000000" />

  <!-- Main Brick Card Body -->
  <rect x="8" y="8" width="852" height="222" rx="14" fill="#0D0F12" stroke="#2A2F3D" stroke-width="4" />

  <!-- Dot Grid Pattern Overlay -->
  <rect x="12" y="12" width="844" height="214" rx="10" fill="url(#baseplate-dots)" />

  <!-- Top Accent Studs -->
  <g transform="translate(620, -2)">
    <!-- Stud 1 (Red) -->
    <rect x="0" y="2" width="24" height="12" rx="4" fill="url(#stud-red)" stroke="#1A1C1C" stroke-width="2" />
    <!-- Stud 2 (Yellow) -->
    <rect x="32" y="2" width="24" height="12" rx="4" fill="url(#stud-yellow)" stroke="#1A1C1C" stroke-width="2" />
    <!-- Stud 3 (Blue) -->
    <rect x="64" y="2" width="24" height="12" rx="4" fill="url(#stud-blue)" stroke="#1A1C1C" stroke-width="2" />
    <!-- Stud 4 (Green) -->
    <rect x="96" y="2" width="24" height="12" rx="4" fill="url(#stud-green)" stroke="#1A1C1C" stroke-width="2" />
  </g>

  <!-- Header Brand Bar -->
  <g transform="translate(36, 32)">
    <!-- Brand Tag Box -->
    <rect x="0" y="0" width="132" height="32" rx="6" fill="#AF101A" stroke="#1A1C1C" stroke-width="2.5" />
    <text x="14" y="22" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="15" fill="#FFFFFF" letter-spacing="1">
      FARID<tspan fill="#FFD700">.DEV</tspan>
    </text>

    <!-- Subtitle Pill -->
    <rect x="144" y="2" width="115" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="2" />
    <text x="156" y="21" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#94A3B8">
      // UMS 2026
    </text>

    <!-- Origin Pill -->
    <rect x="270" y="2" width="175" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="2" />
    <text x="282" y="21" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#FFD700">
      ★ ALUMNI MAN 1 SKA
    </text>

    <!-- Status Pill -->
    <rect x="580" y="0" width="224" height="32" rx="6" fill="#00852B" stroke="#1A1C1C" stroke-width="2" />
    <circle cx="598" cy="16" r="4.5" fill="#FFD700" />
    <text x="612" y="21" font-family="'Space Mono', monospace" font-weight="700" font-size="10.5" fill="#FFFFFF" letter-spacing="0.5">
      AVAILABLE FOR PROJECTS
    </text>
  </g>

  <!-- Main Headline -->
  <g transform="translate(36, 112)">
    <text font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" letter-spacing="-0.5">
      <tspan fill="#F8FAFC">ENGINEERING </tspan>
      <tspan fill="#FF3B30">SCALABLE SYSTEMS </tspan>
      <tspan fill="#0A84FF">WITH PURPOSE.</tspan>
    </text>
  </g>

  <!-- Subheadline & Philosophy -->
  <g transform="translate(36, 150)">
    <text font-family="'Space Mono', monospace" font-weight="700" font-size="13" fill="#E2E8F0">
      &gt; Full-Stack Software Engineer • 3D Physics Lanyard • Three-VRM Avatar • Modular Tactile UI
    </text>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(36, 182)">
    <!-- Pill 1: React 19 -->
    <rect x="0" y="0" width="112" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="12" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#38BDF8">⚛ REACT 19</text>

    <!-- Pill 2: Three.js / R3F -->
    <rect x="122" y="0" width="128" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="134" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#F8FAFC">▲ THREE.JS / R3F</text>

    <!-- Pill 3: Rapier Physics -->
    <rect x="260" y="0" width="144" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="272" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#FFD700">⚡ RAPIER PHYSICS</text>

    <!-- Pill 4: Pixiv VRM -->
    <rect x="414" y="0" width="144" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="426" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#34C759">👤 THREE-VRM 3D</text>

    <!-- Pill 5: Tailwind v4 -->
    <rect x="568" y="0" width="132" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="580" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#38BDF8">🎨 TAILWIND v4</text>

    <!-- Pill 6: Vite 8 -->
    <rect x="710" y="0" width="94" height="28" rx="6" fill="#161920" stroke="#2A2F3D" stroke-width="1.8" />
    <text x="722" y="19" font-family="'Space Mono', monospace" font-weight="700" font-size="11" fill="#FBBF24">⚡ VITE 8</text>
  </g>
</svg>
